<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Pomodoro Timer: Focus. Rest. Repeat." xmlns:c2pa="http://c2pa.org/manifest">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFE6DE"/><stop offset=".55" stop-color="#E8E4FF"/><stop offset="1" stop-color="#D9F3E7"/></linearGradient>
<linearGradient id="t" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#E36E57"/><stop offset="1" stop-color="#6F60F0"/></linearGradient>
<radialGradient id="tm" cx=".35" cy=".35" r=".8"><stop offset="0" stop-color="#FFC2B3"/><stop offset="1" stop-color="#E36E57"/></radialGradient>
<path id="s" d="M0-14C2-4 4-2 14 0 4 2 2 4 0 14-2 4-4 2-14 0-4-2-2-4 0-14Z"/><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E36E57"/><stop offset="1" stop-color="#B3A9FA"/></linearGradient><clipPath id="c"><rect width="1200" height="400" rx="32"/></clipPath></defs>
<style>.blob{animation:drift 11s ease-in-out infinite alternate}.b2{animation-duration:14s;animation-direction:alternate-reverse}
.bob{animation:bob 3.4s ease-in-out infinite}.d1{animation-delay:-1.1s}.d2{animation-delay:-2.2s}
.tw{animation:tw 3.2s ease-in-out infinite}.t2{animation-delay:-1s}.t3{animation-delay:-2s}
.spin{animation:spin 9s linear infinite}
@keyframes drift{to{transform:translate(40px,-20px) scale(1.12)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes tw{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.prog{stroke-dasharray:691.1;animation:prog 8s ease-in-out infinite}@keyframes prog{0%{stroke-dashoffset:691.1}85%,100%{stroke-dashoffset:0}}
.orb{transform-origin:270px 200px;animation:orb 8s ease-in-out infinite}@keyframes orb{0%{transform:rotate(0)}85%,100%{transform:rotate(360deg)}}
.breathe{transform-origin:270px 200px;animation:br 4s ease-in-out infinite}@keyframes br{50%{transform:scale(1.06)}}
.pop{animation:pop .7s cubic-bezier(.2,.9,.3,1.3) both}@keyframes pop{from{opacity:0;transform:translateY(14px)}}
.rise{animation:pop .9s ease-out both}.r2{animation-delay:.15s}.r3{animation-delay:.3s}</style>
<g clip-path="url(#c)"><rect width="1200" height="400" fill="url(#bg)"/>
<circle class="blob" cx="120" cy="360" r="150" fill="#CFC8FF" opacity=".5"/><circle class="blob b2" cx="1100" cy="40" r="160" fill="#A9E3CD" opacity=".45"/><circle class="blob" cx="640" cy="-40" r="120" fill="#FFC9BC" opacity=".5"/>
<use class="tw" href="#s" x="80" y="70" fill="#FFB4A2"/><use class="tw t2" href="#s" x="1130" y="330" fill="#B3A9FA"/><use class="tw t3" href="#s" x="560" y="360" fill="#F5B8C8"/><use class="tw" href="#s" x="1040" y="200" fill="#A9E3CD"/><use class="tw t2" href="#s" x="470" y="40" fill="#FFE29A"/>
<circle class="breathe" cx="270" cy="200" r="132" fill="#fff" opacity=".55"/>
<circle cx="270" cy="200" r="110" fill="none" stroke="#6F60F0" stroke-opacity=".13" stroke-width="18"/>
<circle class="prog" cx="270" cy="200" r="110" fill="none" stroke="url(#rg)" stroke-width="18" stroke-linecap="round" transform="rotate(-90 270 200)"/>
<g class="orb"><circle cx="270" cy="90" r="11" fill="#fff" stroke="#E36E57" stroke-width="5"/></g>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle"><text x="270" y="214" font-size="52" font-weight="800" fill="#A8483A">25:00</text><text x="270" y="248" font-size="18" font-weight="700" fill="#7A6B88">FOCUS</text></g>
<g transform="translate(270 152) scale(1.2)"><g class="bob "><g class=""><circle r="15" fill="url(#tm)"/><circle r="10" fill="#FFF6F2"/><path d="M0 0V-6M0 0l4 2.5" stroke="#5548C8" stroke-width="2.2" stroke-linecap="round"/><path d="M0-15c-2-4-7-5-10-3 4 0 6 2 7 4-4-1-7 0-9 3 4-1 8-1 12 1 4-2 8-2 12-1-2-3-5-4-9-3 1-2 3-4 7-4-3-2-8-1-10 3z" fill="#3FA77A"/></g></g></g>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle"><text class="rise" x="730" y="118" font-size="66" font-weight="800" fill="url(#t)">Pomodoro Timer</text>
<text class="rise r2" x="730" y="166" font-size="30" font-weight="700" fill="#5548C8">Focus. Rest. Repeat.</text>
<text class="rise r3" x="730" y="210" font-size="21" fill="#7A6B88">A bilingual timer with animations, tasks and stats</text>
<g class="pop" style="animation-delay:0.3s"><rect x="518" y="258" width="200" height="42" rx="21" fill="#FFD5C9"/><text x="618" y="285" font-size="18" font-weight="700" fill="#A8483A" text-anchor="middle">✨ Animations</text></g><g class="pop" style="animation-delay:0.44999999999999996s"><rect x="732" y="258" width="210" height="42" rx="21" fill="#DAD5FF"/><text x="837" y="285" font-size="18" font-weight="700" fill="#5548C8" text-anchor="middle">💾 localStorage</text></g><g class="pop" style="animation-delay:0.6s"><rect x="513" y="312" width="230" height="42" rx="21" fill="#D9F3E7"/><text x="628" y="339" font-size="18" font-weight="700" fill="#1F7350" text-anchor="middle">🌍 English · עברית</text></g><g class="pop" style="animation-delay:0.75s"><rect x="757" y="312" width="190" height="42" rx="21" fill="#FBD5E0"/><text x="852" y="339" font-size="18" font-weight="700" fill="#A03A5C" text-anchor="middle">🌙 Dark mode</text></g></g></g><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>