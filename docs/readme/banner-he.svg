<g transform="translate(930 152) scale(1.2)"><g class="bob "><g class=""><circle r="15" fill="url(#tm)"/><circle r="10" fill="#FFF6F2"/><path d="M0 0V-6M0 0l4 2.5" stroke="#5548C8" stroke-width="2.2" stroke-linecap="round"/><path d="M0-15c-2-4-7-5-10-3 4 0 6 2 7 4-4-1-7 0-9 3 4-1 8-1 12 1 4-2 8-2 12-1-2-3-5-4-9-3 1-2 3-4 7-4-3-2-8-1-10 3z" fill="#3FA77A"/></g></g></g>
</g>
