<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 170" width="1200" height="170" role="img" aria-label="Built by Noya Adivi" xmlns:c2pa="http://c2pa.org/manifest">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFE6DE"/><stop offset=".55" stop-color="#E8E4FF"/><stop offset="1" stop-color="#D9F3E7"/></linearGradient>
<linearGradient id="t" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#E36E57"/><stop offset="1" stop-color="#6F60F0"/></linearGradient>
<radialGradient id="tm" cx=".35" cy=".35" r=".8"><stop offset="0" stop-color="#FFC2B3"/><stop offset="1" stop-color="#E36E57"/></radialGradient>
<path id="s" d="M0-14C2-4 4-2 14 0 4 2 2 4 0 14-2 4-4 2-14 0-4-2-2-4 0-14Z"/><clipPath id="c"><rect width="1200" height="170" rx="28"/></clipPath></defs><style>.blob{animation:drift 11s ease-in-out infinite alternate}.b2{animation-duration:14s;animation-direction:alternate-reverse}
.bob{animation:bob 3.4s ease-in-out infinite}.d1{animation-delay:-1.1s}.d2{animation-delay:-2.2s}
.tw{animation:tw 3.2s ease-in-out infinite}.t2{animation-delay:-1s}.t3{animation-delay:-2s}
.spin{animation:spin 9s linear infinite}
@keyframes drift{to{transform:translate(40px,-20px) scale(1.12)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes tw{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}.beat{transform-origin:600px 44px;animation:beat 1.6s ease-in-out infinite}@keyframes beat{50%{transform:scale(1.15)}}</style>
<g clip-path="url(#c)"><rect width="1200" height="170" fill="url(#bg)"/><circle class="blob" cx="140" cy="150" r="100" fill="#CFC8FF" opacity=".5"/><circle class="blob b2" cx="1060" cy="20" r="110" fill="#FFC9BC" opacity=".5"/>
<use class="tw" href="#s" x="260" y="60" fill="#FFB4A2"/><use class="tw t2" href="#s" x="940" y="120" fill="#B3A9FA"/><use class="tw t3" href="#s" x="980" y="50" fill="#A9E3CD"/>
<text class="beat" x="600" y="56" font-size="34" text-anchor="middle">✉️</text>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle"><text x="600" y="108" font-size="40" font-weight="800" fill="url(#t)">Built by Noya Adivi</text><text x="600" y="145" font-size="22" fill="#7A6B88">For questions, feedback and opportunities, get in touch</text></g></g><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>