<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 170" width="1200" height="170" role="img" aria-label="נבנה על ידי נויה אדיבי" xmlns:c2pa="http://c2pa.org/manifest">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D9F3E7"/><stop offset=".55" stop-color="#E8E4FF"/><stop offset="1" stop-color="#FFE6DE"/></linearGradient>
<linearGradient id="t" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#E36E57"/><stop offset="1" stop-color="#6F60F0"/></linearGradient>
<clipPath id="c"><rect width="1200" height="170" rx="28"/></clipPath><path id="s" d="M0-14C2-4 4-2 14 0 4 2 2 4 0 14-2 4-4 2-14 0-4-2-2-4 0-14Z"/></defs><style>
.blob{animation:drift 11s ease-in-out infinite alternate}.b2{animation-duration:14s;animation-direction:alternate-reverse}.b3{animation-duration:17s}
.bob{animation:bob 3.4s ease-in-out infinite}.d1{animation-delay:-.9s}.d2{animation-delay:-1.8s}
